# Production — Scaleway / leafitome.prumme.dev
# Usage : docker compose -f docker-compose.prod.yml --env-file .env.production up -d --build

services:
  postgres:
    image: postgres:16-alpine
    container_name: leafitome-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-leafitome}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD requis}
      POSTGRES_DB: ${POSTGRES_DB:-leafitome}
    volumes:
      - leafitome_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U leafitome -d leafitome']
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - leafitome

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: leafitome-api
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3001
      DATABASE_URL: postgres://${POSTGRES_USER:-leafitome}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-leafitome}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET requis}
      CORS_ORIGIN: ${CORS_ORIGIN:-https://leafitome.prumme.dev}
      COOKIE_SECURE: ${COOKIE_SECURE:-true}
      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY:?VAPID_PUBLIC_KEY requis}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY:?VAPID_PRIVATE_KEY requis}
      VAPID_SUBJECT: ${VAPID_SUBJECT:-mailto:hello@prumme.dev}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - leafitome

  caddy:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    container_name: leafitome-caddy
    restart: unless-stopped
    ports:
      - '80:80'
      - '443:443'
      - '443:443/udp'
    volumes:
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - api
    networks:
      - leafitome

volumes:
  leafitome_pg_data:
  caddy_data:
  caddy_config:

networks:
  leafitome:
    driver: bridge
