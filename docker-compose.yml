services:
  postgres:
    image: postgres:16-alpine
    container_name: leafitome-postgres
    restart: unless-stopped
    ports:
      - '5433:5432'
    environment:
      POSTGRES_USER: leafitome
      POSTGRES_PASSWORD: leafitome
      POSTGRES_DB: leafitome
    volumes:
      - leafitome_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U leafitome -d leafitome']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  leafitome_pg_data:
